<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبارات الرخصة المهنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">تخطي إلى المحتوى</a>

<header class="top">
  <div class="wrap top-in">
    <button class="brand" data-go="home" aria-label="الصفحة الرئيسية">
      <img id="brandLogo" alt="" hidden>
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text"><b id="brandName"></b><small id="brandOwner"></small></span>
    </button>
    <nav class="top-nav" aria-label="التنقل">
      <button data-go="home">الرئيسية</button>
      <button data-go="standards">المعايير</button>
      <button data-go="history">السجل</button>
      <button id="userChip" class="user-chip" data-go="profile" hidden></button>
    </nav>
  </div>
</header>

<main id="main" class="wrap"></main>

<footer class="foot">
  <div class="wrap">
    <p><b id="footName"></b> — <span id="footOwner"></span></p>
  </div>
</footer>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button id="modalOk" class="btn"></button>
      <button id="modalCancel" class="btn ghost">رجوع</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/tenants.js"></script>
<script src="js/specs.js"></script>
<script src="js/guide.js"></script>
<script src="js/app.js"></script>
</body>
</html>
